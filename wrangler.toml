# wrangler.toml — konfigurasi Cloudflare Worker Coding Island (berkas statis + API + D1)
# Deploy: npx wrangler deploy   |   Uji lokal: npx wrangler dev
# "name" harus sama dengan nama Worker di dashboard Cloudflare.

name = "codingisland"
main = "worker.js"
compatibility_date = "2026-09-01"

# Berkas statis (index.html, css/, js/, image/). Yang dikecualikan ada di .assetsignore.
# Permintaan /api/* selalu ke worker.js; selainnya langsung dilayani sebagai berkas.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Database D1 (dibuat manual di dashboard, dihubungkan lewat database_id). Tabel + data contoh diisi otomatis oleh worker saat pertama dibuka.
[[d1_databases]]
binding = "DB"
database_name = "coding-island-db"
database_id = "9e840ba1-077f-4322-8560-d01841b7b21d"

[vars]
# "1" = halaman masuk menampilkan daftar akun contoh. Ubah ke "0" saat dipakai sungguhan.
TAMPILKAN_AKUN_DEMO = "1"
# "1" = alat pengembang (?dev=1) boleh mengubah progres siswa. Biarkan "0" di server.
MODE_DEV = "0"
# Jumlah iterasi PBKDF2 untuk hash baru (maksimal 100000 di Cloudflare Workers)
ITERASI_PBKDF2 = "100000"
