<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Island — Belajar Ngoding bersama Robot Tutor</title>
  <meta name="description" content="Game edukasi untuk siswa SD kelas 3–6: belajar mengetik kode dan logika sederhana sambil berpetualang di 4 pulau bersama Robot Tutor.">
  <meta name="theme-color" content="#287A74">

  <!-- Ikon: favicon 32 px dan ikon layar utama 180 px (dibuat dari robot hai.png) -->
  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">

  <!-- Pratinjau saat tautan dibagikan (WhatsApp, Facebook, dll.).
       og:image & og:url wajib alamat lengkap: ganti domain jika nama proyek Cloudflare berbeda. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:site_name" content="Coding Island">
  <meta property="og:title" content="Coding Island — Belajar Ngoding bersama Robot Tutor">
  <meta property="og:description" content="Game edukasi untuk siswa SD kelas 3–6: ketik kode berbahasa Indonesia, gerakkan robot, dan kumpulkan bintang di 4 pulau.">
  <meta property="og:url" content="https://coding-island.pages.dev/">
  <meta property="og:image" content="https://coding-island.pages.dev/image/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Robot Tutor melambaikan tangan di pantai dengan tulisan Coding Island">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Semua aset dari server sendiri (tanpa CDN) agar tidak terganggu filter internet sekolah.
       Font Baloo 2, Nunito, JetBrains Mono ada di fonts/ (@font-face di css/app.css). -->
  <link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/baloo-2-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Gaya proyek, lalu Tailwind CSS hasil Tailwind CLI v3 (npm run build:css).
       Urutan ini sengaja: dulu Tailwind CDN menyisipkan gayanya SETELAH app.css, jadi kelas
       Tailwind menang bila sama kuat. Urutan yang sama menjaga tampilan tetap persis. -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="font-isi text-tinta bg-latar">
  <a href="#app" class="lewati-konten" data-lewati>Lewati ke isi halaman</a>

  <!-- Semua halaman dirender router ke dalam elemen ini -->
  <main id="app" tabindex="-1"></main>

  <noscript>
    <div style="padding:2rem;text-align:center;font-size:1.25rem">
      Coding Island butuh JavaScript. Nyalakan JavaScript di browser ya.
    </div>
  </noscript>

  <script>
    // Sekali per perangkat: buang cache berkas versi lama & sisa data demo di penyimpanan browser,
    // lalu muat ulang. Naikkan VERSI_BERSIH bila suatu saat perlu membersihkan lagi.
    (function () {
      var VERSI_BERSIH = '2026-10-23';
      try {
        if (localStorage.getItem('ci_versi_bersih') === VERSI_BERSIH) return;
        var simpan = { ci_draf: 1, ci_preferensi: 1 };
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && k.indexOf('ci_') === 0 && !simpan[k]) localStorage.removeItem(k);
        }
        fetch('/api/bersihkan-cache', { cache: 'no-store' }).catch(function () {}).then(function () {
          localStorage.setItem('ci_versi_bersih', VERSI_BERSIH);
          location.reload();
        });
      } catch (e) { /* penyimpanan diblokir: lewati */ }
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
